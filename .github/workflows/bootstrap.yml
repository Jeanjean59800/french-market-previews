name: Publish static preview sources

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore the static sites
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f lnkflow/index.html && -f crawlraven/index.html && -f migma/index.html && -f skippr/index.html && -f acmebot/index.html ]]; then
            echo "Static sources are already present."
            exit 0
          fi

          cat .bootstrap/part-* > /tmp/french-market-site.b64
          base64 --decode /tmp/french-market-site.b64 > /tmp/french-market-site.tar.gz
          echo "ff37f6b2f091b96e39ea622f7c3e791677ccf3edbc67989cb9439b102385ce59  /tmp/french-market-site.tar.gz" | sha256sum --check
          tar -xzf /tmp/french-market-site.tar.gz -C .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll README.md PROSPECT_NOTES.md lnkflow crawlraven migma skippr acmebot

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Publish five French market preview sites"
          git push
